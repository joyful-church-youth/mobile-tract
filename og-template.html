<!DOCTYPE html>
<!-- og-image.png(1200×630) 원본. 헤드리스 브라우저로 1200×630 캡처해서 사용 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="tokens.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  position: relative;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  word-break: keep-all;
}
.frame {
  position: absolute;
  inset: 40px 56px;
  border-top: 3px solid var(--color-ink);
  border-bottom: 1px solid var(--color-ink);
}
.fruit {
  position: absolute;
  right: -40px;
  top: 40px;
  width: 520px;
  height: 520px;
}
.p-body { fill: var(--color-accent); }
.p-leaf { fill: var(--color-leaf); }
.p-leaf-front { opacity: 0.85; }
.p-stem { stroke: var(--color-stem); }
.content {
  position: absolute;
  left: 56px;
  top: 76px;
}
.church {
  font-size: 26px;
  font-weight: 700;
}
.date {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  margin-top: 36px;
  font-family: var(--font-display);
  line-height: 0.82;
}
.date b {
  font-size: 200px;
  font-weight: 600;
  letter-spacing: -0.055em;
  margin-left: -8px;
}
.date span {
  font-size: 40px;
  font-weight: 600;
  line-height: 1.2;
  padding: 2px 14px;
  border: 3px solid var(--color-ink);
  background: var(--color-paper);
  margin-bottom: 22px;
}
.title {
  margin-top: 40px;
  font-family: var(--font-display);
  font-size: 66px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.15;
}
.meta {
  position: absolute;
  left: 56px;
  bottom: 56px;
  font-size: 24px;
  color: var(--color-ink-2);
}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="persimmon" viewBox="0 0 200 200">
      <ellipse class="p-body" cx="100" cy="114" rx="88" ry="80"/>
      <path class="p-stem" d="M100 38 C100 30 102 22 108 16" fill="none" stroke-width="6" stroke-linecap="round"/>
      <path class="p-leaf" d="M100 38 C82 24 60 24 44 38 C62 46 84 46 100 38 Z"/>
      <path class="p-leaf" d="M100 38 C118 24 140 24 156 38 C138 46 116 46 100 38 Z"/>
      <path class="p-leaf p-leaf-front" d="M100 36 C90 42 90 54 100 60 C110 54 110 42 100 36 Z"/>
    </symbol>
  </svg>
  <div class="frame"></div>
  <svg class="fruit"><use href="#persimmon"/></svg>
  <div class="content">
    <p class="church">기쁨의교회</p>
    <p class="date"><b>11.15</b><span>주일</span></p>
    <h1 class="title">추수감사 새가족 초청주일</h1>
  </div>
  <p class="meta">오전 11시 주일예배 · 오후 2시 청년예배 · 남영캠퍼스</p>
</body>
</html>
