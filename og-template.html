<!DOCTYPE html>
<!-- og-image.png(1020×630) 원본. 디자인 캔버스 OG 시안을 옮긴 것. 헤드리스 브라우저로 1020×630 캡처해서 사용 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="tokens.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1020px;
  height: 630px;
  overflow: hidden;
  position: relative;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  word-break: keep-all;
}
img { display: block; object-fit: contain; }
.frame {
  position: absolute;
  inset: 40px;
  border-top: 3px solid var(--color-ink);
  border-bottom: 1px solid var(--color-ink);
}
.fruit {
  position: absolute;
  right: -119px;
  top: 29px;
  width: 535px;
  height: 535px;
}
.p-body { fill: var(--color-accent); }
.p-leaf { fill: var(--color-leaf); }
.p-leaf-front { opacity: 0.85; }
.p-stem { stroke: var(--color-stem); }
.content {
  position: absolute;
  left: 40px;
  top: 150px;
  display: flex;
  flex-direction: column;
}
.meta {
  position: absolute;
  left: 40px;
  bottom: 56px;
  font-size: 24px;
  color: var(--color-ink-2);
}
</style>
</head>
<body>
  <div class="frame">
    <img src="assets/logo-wordmark.svg" alt="기쁨의교회" style="width:148px;height:79px">
  </div>
  <svg class="fruit" viewBox="0 0 200 200" aria-hidden="true">
    <ellipse class="p-body" cx="100" cy="114" rx="88" ry="80"/>
    <path class="p-stem" d="M100 38 C100 30 102 22 108 16" fill="none" stroke-width="6" stroke-linecap="round"/>
    <path class="p-leaf" d="M100 38 C82 24 60 24 44 38 C62 46 84 46 100 38 Z"/>
    <path class="p-leaf" d="M100 38 C118 24 140 24 156 38 C138 46 116 46 100 38 Z"/>
    <path class="p-leaf p-leaf-front" d="M100 36 C90 42 90 54 100 60 C110 54 110 42 100 36 Z"/>
  </svg>
  <div class="content">
    <img src="assets/lettering-date.svg" alt="26.11.15. 추수감사주일" style="width:351px;height:40px">
    <img src="assets/lettering-invitation.svg" alt="招請 Invitation" style="width:552px;height:207px">
    <img src="assets/lettering-title.svg" alt="새생명 초청 축제" style="width:553px;height:81px">
  </div>
  <p class="meta">오전 11시 주일예배 · 오후 2시 청년예배 · 남영캠퍼스</p>
</body>
</html>
